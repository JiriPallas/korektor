<!DOCTYPE html>

<head>

<link rel="manifest" href="manifest.webmanifest">

<script>/*JAZYK*/const JAZYK = "cs", ZAKLAD = "";/*/JAZYK*/</script>
<meta name="theme-color" content="#0B2A66">
<style>
  :root { --m: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  .stranka { position: fixed; inset: 0; display: none; flex-direction: column; padding: 20px 30px; gap: 14px; }
  .stranka.ukazana { display: flex; }
  button { font: bold calc(30px * var(--m)) "Segoe UI", system-ui, sans-serif; border-radius: 12px; cursor: pointer;
           padding: 8px 14px; min-height: 0; }
  button:disabled { background: #556080 !important; color: #8890A8 !important; border-color: #556080 !important; cursor: default; }

  /* ---- výběr dokumentu ---- */
  #vyber { background: #BFF0BF; color: #000; }
  #vyber h1 { margin: 0; font-size: calc(40px * var(--m)); }
  #tri { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 2fr; gap: 24px; min-height: 0; }
  #zona { grid-area: 1 / 1 / 3 / 2; border: 8px dashed #000; border-radius: 24px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 20px; text-align: center; background: #E8FBE8;
          font-size: calc(40px * var(--m)); font-weight: bold; }
  #zona.nad { background: #FFE000; border-style: solid; }
  #zona small { font-size: calc(24px * var(--m)); font-weight: normal; }
  #vyber button { background: #fff; color: #000; border: 4px solid #000; font-size: calc(36px * var(--m)); }
  #b_vybrat { grid-area: 1 / 2 / 3 / 3; background: #000 !important; color: #FFE000 !important; font-size: calc(44px * var(--m)) !important; }
  #b_zavrit1 { grid-area: 1 / 3 / 2 / 4; }
  #b_posledni { grid-area: 2 / 3 / 3 / 4; overflow-wrap: anywhere; }
  #b_posledni:disabled { visibility: hidden; }
  #b_slovnik { font-size: calc(20px * var(--m)) !important; font-weight: normal; padding: 6px 14px; align-self: flex-start;
               background: #FFF6C0 !important; border: 2px solid #000 !important; }
  #b_slovnik.pripojen { background: transparent !important; border-color: transparent !important; }
  #v_stav { font-size: calc(30px * var(--m)); font-weight: bold; min-height: 1.3em; color: #8A0000; }

  /* ---- oprava ---- */
  #oprava { background: #0B2A66; color: #fff; }
  #horni { display: flex; gap: 18px; align-items: stretch; flex: 2; min-height: 0; }
  #slovo { flex: 1; color: #FFE000; font-weight: bold; font-size: calc(96px * var(--m)); overflow: hidden;
           white-space: nowrap; text-overflow: ellipsis; align-self: center; }
  #oprava button { background: #fff; color: #000; border: 4px solid #fff; }
  #b_zapamatovat { background: #1E3F85 !important; color: #fff !important; font-size: calc(24px * var(--m)); }
  .popis { font-size: calc(22px * var(--m)); }
  #navrh { font: bold calc(72px * var(--m)) "Segoe UI", system-ui, sans-serif; color: #000; background: #fff;
           border: 6px solid #FFE000; border-radius: 12px; padding: 4px 16px; width: 100%; }
  #veta { flex: 2; font-size: calc(48px * var(--m)); overflow: hidden; line-height: 1.3; min-height: 0; }
  #veta b { color: #FFE000; text-decoration: underline; }
  #dole { display: grid; grid-template-columns: 2fr 3fr 3fr 3fr; gap: 18px; flex: 3; min-height: 0; }
  #b_vratit { background: #1E3F85 !important; color: #fff !important; font-size: calc(26px * var(--m)); }
  #b_preskocit { background: #FFE000 !important; border-color: #FFE000 !important; font-size: calc(36px * var(--m)); }
  #b_opravit { background: #00702E !important; color: #fff !important; font-size: calc(36px * var(--m)); }
  #stav { display: flex; gap: 18px; align-items: center; }
  #stav span { flex: 1; color: #FFFFFF; font-size: calc(32px * var(--m)); font-weight: bold; }
  #stav button { font-size: calc(22px * var(--m)); background: #1E3F85 !important; color: #fff !important; }
  #stav button.zavrit, #vyber button.zavrit { background: #A00000 !important; color: #fff !important; border-color: #A00000 !important; }
  #b_vsechny { background: #00501F !important; color: #fff !important; border-color: #7CFF9E !important; font-size: calc(30px * var(--m)); }
  #b_zapamatovat_vse { background: #102E66 !important; color: #fff !important; border-color: #9FC0FF !important; font-size: calc(24px * var(--m)); }
  #b_ulozit { background: #FFE000 !important; color: #000 !important; border-color: #FFE000 !important; }

  /* ---- nastavení (oranžová) ---- */
  #nast { background: #FF9A1F; color: #000; gap: 10px; overflow-y: auto; }
  #nast h1 { margin: 0; font-size: calc(40px * var(--m)); }
  #nast .popis { font-size: calc(24px * var(--m)); font-weight: bold; }
  #nast .rada { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; flex: 1; min-height: calc(60px * var(--m)); }
  #nast button { background: #000; color: #fff; border: 4px solid #000; font-size: calc(26px * var(--m)); }
  #nast button.zvoleno { background: #fff; color: #000; border: 6px solid #000; }
  #n_slovnik_volby { display: flex; flex-direction: column; gap: 8px; }
  #nast #b_vybrat_sl, #nast #b_vytvorit_sl { background: #000 !important; color: #fff !important; border: 4px solid #000 !important; font-size: calc(26px * var(--m)) !important; padding: 0; margin: 0; width: auto; }
  #n_hotovo { background: #00702E !important; flex: 1; }
  #b_nastaveni { font-size: calc(22px * var(--m)) !important; padding: 6px 18px; align-self: flex-start; background: #FFF6C0 !important; border: 3px solid #000 !important; }
  #dolni { display: flex; gap: 18px; align-items: center; }
  #uvod { position: fixed; inset: 0; background: #0B2A66; color: #fff; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 30px; z-index: 10; cursor: pointer; text-align: center;
          border: 24px solid #FFE000; }
  #uvod h1 { color: #FFE000; font-size: 64px; margin: 0; }
  #uvod p { font-size: 36px; margin: 0; }
</style>
</head>
<body>
<div id="uvod"><h1 data-t="nazev"></h1><p data-t="uvodKlik"></p><p style="font-size:22px" data-t="uvodPozn"></p></div>

<div id="vyber" class="stranka ukazana">
  <h1 data-t="nadpis"></h1>
  <div id="tri">
    <div id="zona"><span data-t="zona"></span><small data-t="zonaMale"></small></div>
    <button id="b_vybrat" data-t="vybrat" data-h="vybrat"></button>

  <div id="horni"><div id="slovo"></div>
    <button id="b_zapamatovat" data-t="zapamatovat" data-h="zapamatovat"></button>
    <button id="b_zapamatovat_vse" data-t="zapamatovatVse" data-h="zapamatovatVse"></button></div>
  <div class="popis" data-t="opravaPopis"></div>
  <input id="navrh" autocomplete="off" spellcheck="false" data-h="navrh">
  <div id="veta"></div>
  <div id="dole">
    <button id="b_vratit" data-t="vratit" data-h="vratit"></button>
    <button id="b_preskocit" data-t="preskocit" data-h="preskocit"></button>
    <button id="b_opravit" data-t="opravit" data-h="opravit"></button>

  </div>
  <div id="stav"><span id="l_stav"></span>
    <button id="b_ulozit" data-t="ulozit" data-h="ulozit"></button>
    <button id="b_nastaveni2" data-t="nastaveniKratke" data-h="nastaveni"></button>
    <button id="b_dokumenty" data-t="jinyDok" data-h="jinyDok"></button>
    <button id="b_zavrit2" class="zavrit" data-t="zavrit" data-h="zavrit"></button></div>
</div>

<div id="nast" class="stranka">
  <h1 data-t="nNadpis"></h1>
  <div class="popis" data-t="nJazyk"></div>
  <div class="rada" id="n_jazyky"></div>
  <div class="popis" data-t="nHlas"></div>
  <div class="rada"><button id="n_hlas"></button></div>
  <div class="popis"><span data-t="nRychlost"></span> <span id="n_rychlost_hodnota"></span></div>
  <div class="rada"><button id="n_pomaleji" data-t="nPomaleji" data-h="pomaleji"></button><button id="n_rychleji" data-t="nRychleji" data-h="rychleji"></button></div>
  <div class="popis"><span data-t="nPismo"></span> <span id="n_pismo_hodnota"></span></div>
  <div class="rada"><button id="n_mensi" data-t="nMensi" data-h="mensi"></button><button id="n_vetsi" data-t="nVetsi" data-h="vetsi"></button></div>

  <div id="n_slovnik_volby">
    <div class="rada"><button id="b_vybrat_sl" data-t="nVybratSl" data-h="vybratSl"></button><button id="b_vytvorit_sl" data-t="nVytvoritSl" data-h="vytvoritSl"></button></div>
    <div class="popis" style="font-weight:normal" data-t="nVarovaniSl"></div>
  </div>
  <div class="rada"><button id="n_hotovo" data-t="nHotovo" data-h="hotovo"></button></div>

<input type="file" id="soubor_nahradni" accept=".docx,.txt" hidden>
<script src="jazyky.js"></script>
<script src="hunspell.js"></script>
<script>
"use strict";
/* KOREKTOR – webová verze 0.1 (zkušební). Stejné ovládání jako program KOREKTOR.
   Opravy se nejdřív jen sbírají („makro“). Teprve po ULOŽIT OPRAVY se stáhne záloha originálu
   a opravy se zapíšou do původního souboru – i když ho senior mezitím ve Wordu doplnil. */
const $ = id => document.getElementById(id);
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const MC = "http://schemas.openxmlformats.org/markup-compatibility/2006";
const J = JAZYKY[JAZYK] || JAZYKY.cs, T = J.t;
const hlaskuj = s => [...s].map(c => J.hlaskovani[c.toLowerCase()] || c.toLowerCase()).join(", ");
const pocetChyb = T.pocetChyb, opravSlovy = T.oprav, slovSlovy = T.slov;
document.documentElement.lang = J.lang.slice(0, 2); document.title = J.nazev;
for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = el.dataset.t === "nazev" ? J.nazev : J.html[el.dataset.t];
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ============================================================ úložiště */
const PREFIX = JAZYK === "cs" ? "korektor." : `korektor.${JAZYK}.`;      // každý jazyk má vlastní paměť
const ls = { get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} } };
const dbk = k => JAZYK === "cs" ? k : `${JAZYK}.${k}`;
const db = new Promise((ok, chyba) => { const r = indexedDB.open("korektor", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("data"); r.onsuccess = () => ok(r.result); r.onerror = () => chyba(r.error); });
async function dbCti(k) { k = dbk(k); try { const d = await db; return await new Promise(ok => { const r = d.transaction("data").objectStore("data").get(k);
  r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); } catch (e) { return undefined; } }
async function dbPis(k, v) { k = dbk(k); try { const d = await db; await new Promise(ok => { const t = d.transaction("data", "readwrite");
  t.objectStore("data").put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} }

/* ============================================================ hlas */
let hlas = null, hlasy = [], mluvId = 0, fronta = [];
let rychlost = ls.get("rychlost", 1), pismo = ls.get("pismo", 1);
const kratkeJmeno = v => v.name.replace(/^(Microsoft|Google)\s+/i, "").split(/[\s(-]/)[0] || v.name;
function vyberHlas() {
  hlasy = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(J.hlasPrefix));
  const ulozeny = ls.get("hlas", "");
  hlas = hlasy.find(v => v.name === ulozeny) || hlasy.find(v => J.preferovanyHlas.test(v.name) && /natural|online/i.test(v.name))
      || hlasy.find(v => J.preferovanyHlas.test(v.name)) || hlasy.find(v => /natural|online/i.test(v.name)) || hlasy[0] || null;
  if ($("nast").classList.contains("ukazana")) obnovNastaveni();
}
if ("speechSynthesis" in window) { vyberHlas(); speechSynthesis.onvoiceschanged = vyberHlas; }
function rekni(text, potom) {
  fronta = []; mluvId++;
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel(); promluv(text, mluvId, potom);
}
function rekniPotom(text) { if ("speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)) fronta.push(text); else rekni(text); }
function promluv(text, id, potom) {
  const u = new SpeechSynthesisUtterance(text); u.lang = J.lang; if (hlas) u.voice = hlas; u.rate = rychlost;
  u.onend = () => { if (id !== mluvId) return; if (fronta.length) promluv(fronta.shift(), id); else if (potom) potom(); };
  speechSynthesis.speak(u);
}

/* ============================================================ slovník */
let hun = null, mujSlovnik = new Set(ls.get("slovnik", [])), cache = new Map();
const slovnikPripraven = (async () => {
  if (typeof nactiHunspell !== "function") throw new Error("Chybí soubor hunspell.js.");
  const [a, d] = await Promise.all([`${ZAKLAD}slovnik/${J.slovnik}.aff`, `${ZAKLAD}slovnik/${J.slovnik}.dic`].map(async f => {
    const r = await fetch(f); if (!r.ok) throw new Error(`Chybí soubor ${f} (chyba ${r.status}).`); return r.arrayBuffer(); }));
  hun = await Promise.race([nactiHunspell(a, d), new Promise((_, ne) => setTimeout(() => ne(new Error("Slovník se načítá příliš dlouho.")), 30000))]);
})();
slovnikPripraven.catch(e => { $("v_stav").textContent = T.slovnikNenacten(e.message); });
/* Můj slovník v souboru Dokumenty\KOREKTOR slovník.txt – stejný používá i program KOREKTOR.
   Jednou se připojí (okno Uložit jako → Uložit), pak se čte a zapisuje sám. Zároveň zůstává kopie v prohlížeči. */
const JMENO_SLOVNIKU = J.souborSlovniku;
let slovnikSoubor = null;          // handle, když je soubor připojený a povolený
async function prectiSouborSlovniku(h) {
  const text = await (await h.getFile()).text();
  return text.replace(/^\uFEFF/, "").split(/\r?\n/).map(x => x.trim()).filter(Boolean);
}
/* Bezpečný zápis: soubor se vždy znovu přečte a sloučí (program mohl mezitím přidat slova);
   když se přečíst nedá, nic se nezapíše; slov nikdy neubyde – kromě jednoho výslovně zapomenutého.
   Zápisy jdou za sebou (fronta), nikdy dva najednou. */
let frontaZapisu = Promise.resolve();
function zapisSlovnik(odebrat = null) {
  ls.set("slovnik", [...mujSlovnik]);
  if (!slovnikSoubor) return Promise.resolve();
  const h = slovnikSoubor;
  frontaZapisu = frontaZapisu.then(async () => {
    try {
      const puvodni = await prectiSouborSlovniku(h);
      puvodni.forEach(x => mujSlovnik.add(x));
      if (odebrat) mujSlovnik.delete(odebrat);
      cache.clear(); ls.set("slovnik", [...mujSlovnik]);
      const stejne = new Set(puvodni);
      if (mujSlovnik.size === stejne.size && [...mujSlovnik].every(x => stejne.has(x))) return;   // není co zapsat
      if (mujSlovnik.size < stejne.size - (odebrat ? 1 : 0)) return;                              // pojistka
      const w = await h.createWritable();
      await w.write([...mujSlovnik].sort((a, b) => a.localeCompare(b, J.lang)).join("\r\n") + "\r\n"); await w.close();
    } catch (e) { console.warn("Slovník se nepodařilo bezpečně zapsat – nic jsem nezměnil:", e); }
    obnovStavSlovniku();
  });
  return frontaZapisu;
}
async function slovnikSeSouborem(h) {          // načte soubor, sloučí s prohlížečem a zapíše zpět
  const zeSouboru = await prectiSouborSlovniku(h);
  const pred = mujSlovnik.size; zeSouboru.forEach(x => mujSlovnik.add(x)); cache.clear();
  slovnikSoubor = h;
  if (mujSlovnik.size !== zeSouboru.length) await zapisSlovnik(); else ls.set("slovnik", [...mujSlovnik]);
  obnovStavSlovniku();
  return mujSlovnik.size - pred;
}
async function pripojSlovnik() {   // při startu: jen dřív připojený soubor – žádné okno se samo neotevře
  try {
    const h = await dbCti("slovnikSoubor");
    if (h) {
      let stav = await h.queryPermission({ mode: "readwrite" });
      if (stav === "prompt") stav = await h.requestPermission({ mode: "readwrite" });
      if (stav === "granted") await slovnikSeSouborem(h);
    }
  } catch (e) { console.warn("Slovník:", e); }
  obnovStavSlovniku();
}
async function vyberSlovnik(vytvorit) {     // vytvorit=false: okno Otevřít (nic nesmaže); true: okno Uložit (nový slovník)
  try {
    const typy = [{ description: T.popisSlovniku, accept: { "text/plain": [".txt"] } }];
    let h;
    if (vytvorit) {
      rekni(T.vytvorteSlovnik);
      h = await showSaveFilePicker({ id: `korektor-slovnik-${JAZYK}`, startIn: "documents", suggestedName: JMENO_SLOVNIKU, types: typy });
    } else {
      rekni(T.vyberteSlovnik);
      [h] = await showOpenFilePicker({ id: `korektor-slovnik-${JAZYK}`, startIn: "documents", multiple: false, types: typy });
      if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") { rekni(T.bezPovoleni); return; }
    }
    await dbPis("slovnikSoubor", h);
    await slovnikSeSouborem(h);
    rekni(T.slovnikPripojen(mujSlovnik.size));
  } catch (e) {
    if (e.name !== "AbortError") { console.warn("Slovník:", e); rekni(T.slovnikNenacten(e.message)); }
  }
  obnovStavSlovniku();
}
function obnovStavSlovniku() {
  const text = slovnikSoubor ? T.slovnikStav(slovnikSoubor.name, mujSlovnik.size) : T.slovnikNepripojen;
  $("n_slovnik_stav").textContent = text; $("l_slovnik_maly").textContent = text;
  $("n_slovnik_volby").style.display = slovnikSoubor ? "none" : "";
}
function jeSpravne(s) {
  if (mujSlovnik.has(s) || mujSlovnik.has(s.toLowerCase())) return true;
  let v = cache.get(s); if (v === undefined) { v = hun.spell(s.replace(/’/g, "'")); cache.set(s, v); } return v;
}
function vzdalenost(a, b) {         // Levenshtein; chyba v háčku/čárce váží méně
  const zakl = c => c.normalize("NFD").replace(/[̀-ͯ]/g, "");
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const x = zakl(a[i - 1]), y = zakl(b[j - 1]);
    const c = a[i - 1] === b[j - 1] ? 0 : (x === y || (J.iy && (x + y === "iy" || x + y === "yi"))) ? 0.5 : 1;   // diakritika (a v češtině i/y) = typická chyba
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);   // prohozená písmena
  }
  return d[m][n];
}
function navrhy(s) {
  let n = hun.suggest(s).filter(x => x !== s && (/[\s-]/.test(s) || !/[\s-]/.test(x)));
  return n.map((x, i) => [x, vzdalenost(s.toLowerCase(), x.toLowerCase()) + i * 0.01]).sort((a, b) => a[1] - b[1]).map(x => x[0]).slice(0, 3);
}
function* kandidati(text) {
  const vynech = [...text.matchAll(/(https?:\/\/|www\.)\S+|\S+@\S+\.\S+/g)].map(m => [m.index, m.index + m[0].length]);
  for (const m of text.matchAll(/\p{L}+(?:['’]\p{L}+)?/gu)) {
    const s = m[0];

  rekni(T.ukladam);
  if (handle.kopie) {                     // nelze zapsat do originálu → opravená kopie
    const novy = await modelNaBlob(model), jm = `${nazev(handle.name)} – ${J.opraveno}${handle.name.slice(handle.name.lastIndexOf("."))}`;
    stahni(novy, jm); const n = opravy.length; opravy = []; ulozRozpracovane();
    $("l_stav").textContent = T.kopieStav(jm);
    rekni(T.kopieRec(opravSlovy(n)));
    return;
  }
  try {
    if ((await handle.queryPermission({ mode: "readwrite" })) !== "granted" &&
        (await handle.requestPermission({ mode: "readwrite" })) !== "granted") {
      rekni(T.bezPovoleni); return;
    }
    const f = await handle.getFile();                       // aktuální verze z disku (mohla se mezitím změnit)
    const puvodni = await f.arrayBuffer();
    const disk = await nactiModel(new File([puvodni], f.name));
    let hotovych = 0; const nenalezene = [];
    for (const o of opravy) {
      const misto = najdiMisto(disk, o);
      if (misto && nahradVModelu(disk, misto[0], misto[1], misto[1] + o.stare.length, o.stare, o.nove)) hotovych++;
      else nenalezene.push(o.stare);
    }
    const cas = new Date(), dnes = `${cas.getFullYear()}-${String(cas.getMonth() + 1).padStart(2, "0")}-${String(cas.getDate()).padStart(2, "0")} ${String(cas.getHours()).padStart(2, "0")}-${String(cas.getMinutes()).padStart(2, "0")}`;
    const jmenoZalohy = `${nazev(f.name)} – ${J.zaloha} ${dnes}${f.name.slice(f.name.lastIndexOf("."))}`;
    await dbPis("zaloha." + f.name, { jmeno: jmenoZalohy, data: puvodni });   // i v prohlížeči
    stahni(new Blob([puvodni]), jmenoZalohy);                                // záloha do Stažených souborů
    const novy = await modelNaBlob(disk);
    const w = await handle.createWritable();
    await w.write(novy); await w.close();
    opravy = []; ulozRozpracovane();
    $("l_stav").textContent = T.ulozenoStav(opravSlovy(hotovych), jmenoZalohy);
    rekni(T.ulozenoRec(slovSlovy(hotovych), nenalezene.length ? slovSlovy(nenalezene.length) : ""));
    model = await nactiModel(await handle.getFile());
    if (chyba) { const ch = dalsiChyba(model.texty, chyba[0], chyba[1]); if (ch) ukazChybu(ch); }
  } catch (e) {
    console.error(e);
    if (e.name === "NotAllowedError" || e.name === "SecurityError") {     // prohlížeč nedovolí zápis → opravená kopie
      const jm = `${nazev(handle.name)} – ${J.opraveno}${handle.name.slice(handle.name.lastIndexOf("."))}`;
      stahni(await modelNaBlob(model), jm); const n = opravy.length; opravy = []; ulozRozpracovane();
      $("l_stav").textContent = T.zapisZakazanStav(jm);
      rekni(T.zapisZakazanRec(opravSlovy(n)));
      return;
    }
    if (e.name === "NoModificationAllowedError" || e.name === "InvalidStateError" || e.name === "NotReadableError") {
      $("l_stav").textContent = T.wordStav;
      rekni(T.wordRec);
    } else { $("l_stav").textContent = "⚠ " + T.ulozeniSelhalo + " " + e.message; rekni(T.ulozeniSelhalo); }
  }
}

/* ============================================================ výběr dokumentu */
function ukazChybuVyberu(text) { $("v_stav").textContent = "⚠ " + text; rekni(text); console.error("KOREKTOR:", text); }
async function vyberDokument() {
  if (nahradniRezim || !window.showOpenFilePicker) { $("soubor_nahradni").value = ""; $("soubor_nahradni").click(); return; }
  $("v_stav").textContent = T.vyberteVOkne;
  let vybrane;
  try {
    vybrane = await showOpenFilePicker({ id: "korektor", startIn: "desktop", multiple: false, excludeAcceptAllOption: false,
      types: [{ description: "Word / text", accept: { "application/octet-stream": [".docx", ".txt"] } }] });
  } catch (e) {
    if (e.name === "AbortError") { $("v_stav").textContent = ""; return; }
    ukazChybuVyberu(T.oknoSelhalo(e.name, e.message)); return;
  }
  const h = vybrane && vybrane[0];
  if (!h) { ukazChybuVyberu(T.zadnySoubor); return; }
  await otevriHandle(h);
}
async function pokracuj() {
  const h = await dbCti("posledni");
  if (!h) { rekni(T.zadnyPosledni); return; }
  try { if ((await h.queryPermission({ mode: "read" })) !== "granted" && (await h.requestPermission({ mode: "read" })) !== "granted") return; }
  catch (e) { rekni(T.posledniNeni); return; }
  await otevriHandle(h);
}
async function zpetNaVyber() {
  if (opravy.length) rekni(T.pozorNeulozene(opravy.length));
  ukazStranku("vyber"); obnovVyber();
}
async function obnovVyber() {
  const h = await dbCti("posledni");
  $("b_posledni").innerHTML = h ? `${J.html.pokracovatS}${esc(nazev(h.name)).toUpperCase()}` : J.html.pokracovat;
  $("b_posledni").disabled = !h;
}

$("soubor_nahradni").addEventListener("change", e => { const f = e.target.files[0]; if (f) otevriHandle(null, "", f); });
const zona = $("zona");
document.addEventListener("dragover", e => { e.preventDefault(); zona.classList.add("nad"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) zona.classList.remove("nad"); });
document.addEventListener("drop", async e => {
  e.preventDefault(); zona.classList.remove("nad");
  const it = [...e.dataTransfer.items].find(i => i.kind === "file");
  if (!it) { rekni(T.pretahnete); return; }
  const soubor = it.getAsFile(), slib = it.getAsFileSystemHandle ? it.getAsFileSystemHandle() : null;
  if (!spusteno) start(true);
  let h = null; try { h = slib ? await slib : null; } catch (er) {}
  if (h && h.kind === "file" && !nahradniRezim) {
    try { await prectiHandle(h); otevriHandle(h); return; } catch (er) { nahradniRezim = true; }
  }
  if (soubor) otevriHandle(null, "", soubor);
});

/* ============================================================ tlačítka, najetí myší, start */
const klik = (id, f) => $(id).addEventListener("click", () => f());
klik("b_vybrat", vyberDokument); klik("b_posledni", pokracuj);
klik("b_preskocit", preskoc); klik("b_opravit", oprav); klik("b_vratit", vrat);
klik("b_zapamatovat", zapamatujToto); klik("b_zapamatovat_vse", zapamatuj);
klik("b_ulozit", ulozOpravy); klik("b_dokumenty", zpetNaVyber);
klik("b_vsechny", opravVsechny);
klik("b_vybrat_sl", () => vyberSlovnik(false)); klik("b_vytvorit_sl", () => vyberSlovnik(true));
klik("b_nastaveni", otevriNastaveni); klik("b_nastaveni2", otevriNastaveni); klik("n_hotovo", zavriNastaveni);
klik("n_hlas", dalsiHlas);
klik("n_pomaleji", () => zmenRychlost(-0.1)); klik("n_rychleji", () => zmenRychlost(+0.1));
klik("n_mensi", () => zmenPismo(-0.1)); klik("n_vetsi", () => zmenPismo(+0.1));
let zavritCas = 0;
function zavri() {
  if (opravy.length && performance.now() - zavritCas > 5000) {
    zavritCas = performance.now();
    rekni(T.zavritNeulozene(opravy.length));
    return;
  }
  ulozRozpracovane(); window.close();
  setTimeout(() => rekni(T.zavriteKrizkem), 300);
}
klik("b_zavrit1", zavri); klik("b_zavrit2", zavri);
function pridejNajeti(el) {
  el.addEventListener("mouseenter", () => {
    if (el.disabled || !spusteno) return;
    if (el.id === "b_posledni" && !el.disabled && el.innerText.includes("\n")) rekni(J.hover.pokracovatS + el.innerText.split("\n").slice(1).join(" ").toLowerCase());
    else rekni(el.dataset.hlas || J.hover[el.dataset.h] || el.innerText);
  });
}
document.querySelectorAll("[data-h]").forEach(pridejNajeti);
let napsano = null;
$("navrh").addEventListener("input", () => { clearTimeout(napsano); napsano = setTimeout(() => { const t = $("navrh").value.trim(); if (t) rekni(T.napsano(t, hlaskuj(t))); }, 900); });
$("navrh").addEventListener("keydown", e => { if (e.key === "Enter") oprav(); });
addEventListener("pagehide", () => ulozRozpracovane());   // neuložené opravy zůstanou zapamatované

let spusteno = false;
function start(tise = false) {
  if (spusteno) return; spusteno = true; $("uvod").remove();
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
  obnovVyber(); obnovStavSlovniku();
  if (!tise) rekni(T.start);
  pripojSlovnik();                  // kliknutí na úvod = souhlas uživatele → smí se zeptat na povolení k dřív připojenému souboru
}
$("uvod").addEventListener("click", () => start());
document.addEventListener("keydown", e => {
  if (!spusteno && !(e.ctrlKey || e.altKey || e.metaKey || /^F\d+$/.test(e.key))) { e.preventDefault(); start(); }
});
/* ============================================================ nastavení */
let predNastavenim = "vyber";
function otevriNastaveni() { predNastavenim = $("oprava").classList.contains("ukazana") ? "oprava" : "vyber"; obnovNastaveni(); ukazStranku("nast"); rekni(T.nastaveni); }
function zavriNastaveni() { ukazStranku(predNastavenim); rekni(T.hotovoZpet); }
function obnovNastaveni() {
  const box = $("n_jazyky"); box.innerHTML = "";
  for (const [kod, j] of Object.entries(JAZYKY)) {
    const b = document.createElement("button"); b.textContent = j.jazyk; b.dataset.hlas = j.jazyk;
    if (kod === JAZYK) b.classList.add("zvoleno");
    b.onclick = () => { if (kod !== JAZYK) location.href = ZAKLAD + kod + "/"; };
    pridejNajeti(b); box.appendChild(b);
  }
  $("n_hlas").textContent = hlas ? "🔊  " + kratkeJmeno(hlas).toUpperCase() + (hlas.localService ? "" : "  (online)") : "🔊  –";
  $("n_rychlost_hodnota").textContent = T.rychlost(Math.round(rychlost * 100));
  $("n_pismo_hodnota").textContent = `${Math.round(pismo * 100)} %`;
  obnovStavSlovniku();
}
function dalsiHlas() {
  if (!hlasy.length) { rekni(T.zadnyHlas); return; }
  hlas = hlasy[(hlasy.indexOf(hlas) + 1) % hlasy.length]; ls.set("hlas", hlas.name);
  obnovNastaveni(); rekni(T.hlasUkazka(kratkeJmeno(hlas)));
}
function zmenRychlost(k) { rychlost = Math.max(0.5, Math.min(2, Math.round((rychlost + k) * 10) / 10)); ls.set("rychlost", rychlost); obnovNastaveni(); rekni(T.rychlostUkazka); }
function zmenPismo(k) { pismo = Math.max(0.6, Math.min(1.6, Math.round((pismo + k) * 10) / 10)); ls.set("pismo", pismo); nastavMeritko(); obnovNastaveni(); rekni(T.pismoUkazka); }
$("n_hlas").dataset.h = "nastaveni"; pridejNajeti($("n_hlas"));

if ("serviceWorker" in navigator) navigator.serviceWorker.register(ZAKLAD + "sw.js").catch(() => {});
</script>
