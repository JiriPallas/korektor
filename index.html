  #v_stav { font-size: calc(30px * var(--m)); font-weight: bold; min-height: 1.3em; color: #8A0000; }

  #veta { flex: 2; font-size: calc(48px * var(--m)); overflow: hidden; line-height: 1.3; min-height: 0; }

  #stav button.zavrit, #vyber button.zavrit { background: #A00000 !important; color: #fff !important; border-color: #A00000 !important; }
  #b_vsechny { background: #00501F !important; color: #fff !important; border-color: #7CFF9E !important; font-size: calc(30px * var(--m)); }
  #b_zapamatovat_vse { background: #102E66 !important; color: #fff !important; border-color: #9FC0FF !important; font-size: calc(24px * var(--m)); }

<script>
"use strict";
/* KOREKTOR – webová verze 0.1 (zkušební). Stejné ovládání jako program KOREKTOR.
   Opravy se nejdřív jen sbírají („makro“). Teprve po ULOŽIT OPRAVY se stáhne záloha originálu
   a opravy se zapíšou do původního souboru – i když ho senior mezitím ve Wordu doplnil. */
const $ = id => document.getElementById(id);
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const MC = "http://schemas.openxmlformats.org/markup-compatibility/2006";
const HLASKOVANI = { i: "měkké i", "í": "měkké dlouhé í", y: "tvrdé y", "ý": "tvrdé dlouhé ý", "ů": "u s kroužkem",
  "ú": "u s čárkou", "ě": "e s háčkem", "á": "dlouhé á", "é": "dlouhé é", "ó": "dlouhé ó", "ň": "eň", "ť": "ťé",
  "ď": "ďé", w: "dvojité vé", x: "iks", q: "kvé", "-": "spojovník", "'": "apostrof", " ": "mezera" };
const hlaskuj = s => [...s].map(c => HLASKOVANI[c.toLowerCase()] || c.toLowerCase()).join(", ");
const pocetChyb = n => n === 0 ? "Žádné chyby." : n === 1 ? "Jedna možná chyba." : n <= 4 ? `${n} možné chyby.` : `${n} možných chyb.`;
const opravSlovy = n => n === 1 ? "1 opravu" : n >= 2 && n <= 4 ? `${n} opravy` : `${n} oprav`;
const slovSlovy = n => n === 1 ? "1 slovo" : n >= 2 && n <= 4 ? `${n} slova` : `${n} slov`;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ============================================================ úložiště */
const ls = { get(k, d) { try { const v = localStorage.getItem("korektor." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem("korektor." + k, JSON.stringify(v)); } catch (e) {} } };
const db = new Promise((ok, chyba) => { const r = indexedDB.open("korektor", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("data"); r.onsuccess = () => ok(r.result); r.onerror = () => chyba(r.error); });
async function dbCti(k) { try { const d = await db; return await new Promise(ok => { const r = d.transaction("data").objectStore("data").get(k);
  r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); } catch (e) { return undefined; } }
async function dbPis(k, v) { try { const d = await db; await new Promise(ok => { const t = d.transaction("data", "readwrite");
  t.objectStore("data").put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} }

/* ============================================================ hlas */
let hlas = null, mluvId = 0, fronta = [];
function vyberHlas() {
  const h = speechSynthesis.getVoices().filter(v => /^cs/i.test(v.lang));
  hlas = h.find(v => /vlasta/i.test(v.name)) || h.find(v => /natural|online/i.test(v.name)) || h[0] || null;
}
if ("speechSynthesis" in window) { vyberHlas(); speechSynthesis.onvoiceschanged = vyberHlas; }
function rekni(text, potom) {
  fronta = []; mluvId++;
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel(); promluv(text, mluvId, potom);
}
function rekniPotom(text) { if ("speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)) fronta.push(text); else rekni(text); }
function promluv(text, id, potom) {
  const u = new SpeechSynthesisUtterance(text); u.lang = "cs-CZ"; if (hlas) u.voice = hlas;
  u.onend = () => { if (id !== mluvId) return; if (fronta.length) promluv(fronta.shift(), id); else if (potom) potom(); };
  speechSynthesis.speak(u);
}

/* ============================================================ slovník */
let hun = null, mujSlovnik = new Set(ls.get("slovnik", [])), cache = new Map();
const slovnikPripraven = (async () => {
  if (typeof nactiHunspell !== "function") throw new Error("Chybí soubor hunspell.js.");
  const [a, d] = await Promise.all(["slovnik/cs_CZ.aff", "slovnik/cs_CZ.dic"].map(async f => {
    const r = await fetch(f); if (!r.ok) throw new Error(`Chybí soubor ${f} (chyba ${r.status}).`); return r.arrayBuffer(); }));
  hun = await Promise.race([nactiHunspell(a, d), new Promise((_, ne) => setTimeout(() => ne(new Error("Slovník se načítá příliš dlouho.")), 30000))]);
})();
slovnikPripraven.catch(e => { $("v_stav").textContent = "⚠ Slovník se nepodařilo načíst: " + e.message; });
function jeSpravne(s) {
  if (mujSlovnik.has(s) || mujSlovnik.has(s.toLowerCase())) return true;
  let v = cache.get(s); if (v === undefined) { v = hun.spell(s.replace(/’/g, "'")); cache.set(s, v); } return v;
}
function vzdalenost(a, b) {         // Levenshtein; chyba v háčku/čárce váží méně
  const zakl = c => c.normalize("NFD").replace(/[̀-ͯ]/g, "");
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const x = zakl(a[i - 1]), y = zakl(b[j - 1]);
    const c = a[i - 1] === b[j - 1] ? 0 : (x === y || (x + y === "iy" || x + y === "yi")) ? 0.5 : 1;   // háček, čárka, i/y = typická chyba
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
  }
  return d[m][n];
}
function navrhy(s) {
  let n = hun.suggest(s).filter(x => x !== s && (/[\s-]/.test(s) || !/[\s-]/.test(x)));
  return n.map((x, i) => [x, vzdalenost(s.toLowerCase(), x.toLowerCase()) + i * 0.01]).sort((a, b) => a[1] - b[1]).map(x => x[0]).slice(0, 3);
}
function* kandidati(text) {
  const vynech = [...text.matchAll(/(https?:\/\/|www\.)\S+|\S+@\S+\.\S+/g)].map(m => [m.index, m.index + m[0].length]);
  for (const m of text.matchAll(/\p{L}+(?:['’]\p{L}+)?/gu)) {
    const s = m[0];
    if (s.length < 2 || (s === s.toUpperCase() && s.length <= 5)) continue;   // zkratky ČR, USA
    if (vynech.some(([a, b]) => m.index >= a && m.index < b)) continue;
    yield [m.index, m.index + s.length, s];
  }
}
let ignorovana = [];            // „zapamatovat jen toto“ – místa v tomto dokumentu, která jsou správně
function jeIgnorovane(odst, i, a, b, s) {
  const t = odst[i], pred = t.slice(Math.max(0, a - 30), a), po = t.slice(b, b + 30);
  return ignorovana.some(x => x.i === i && x.s === s && x.pred === pred && x.po === po);   // přesně toto místo
}
function dalsiChyba(odst, i, od) {
  for (; i < odst.length; i++, od = 0)
    for (const [a, b, s] of kandidati(odst[i])) if (a >= od && !jeSpravne(s) && !jeIgnorovane(odst, i, a, b, s)) return [i, a, b, s];
  return null;
}
function spocitej(odst, doI = Infinity, doOd = 0) {
  let n = 0;
  for (let i = 0; i < odst.length && i <= doI; i++)
    for (const [a, b, s] of kandidati(odst[i])) { if (i === doI && a >= doOd) break; if (!jeSpravne(s) && !jeIgnorovane(odst, i, a, b, s)) n++; }
  return n;
}

/* ============================================================ ZIP (čtení i zápis) */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipSeznam(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("Soubor není dokument Word.");
  const pocet = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const polozky = [];
  for (let k = 0; k < pocet; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Poškozený soubor.");
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), klen = dv.getUint16(p + 32, true);
    polozky.push({ jmeno: dec.decode(u8.subarray(p + 46, p + 46 + nlen)), metoda: dv.getUint16(p + 10, true),
      csize: dv.getUint32(p + 20, true), lho: dv.getUint32(p + 42, true), central: u8.slice(p, p + 46 + nlen + xlen + klen) });
    p += 46 + nlen + xlen + klen;
  }
  return { polozky, konecDat: dv.getUint32(e + 16, true) };
}
async function zipCti(buf, jmeno) {
  const { polozky } = zipSeznam(buf), dv = new DataView(buf), u8 = new Uint8Array(buf);
  const p = polozky.find(x => x.jmeno === jmeno); if (!p) throw new Error("V souboru chybí text dokumentu.");
  const start = p.lho + 30 + dv.getUint16(p.lho + 26, true) + dv.getUint16(p.lho + 28, true);
  const data = u8.subarray(start, start + p.csize);
  if (p.metoda === 0) return new TextDecoder().decode(data);
  return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
}
async function zipNahrad(buf, jmeno, text) {        // ostatní části souboru se kopírují beze změny (bajt po bajtu)
  const { polozky, konecDat } = zipSeznam(buf), u8 = new Uint8Array(buf);
  const surova = new TextEncoder().encode(text), crc = crc32(surova);
  const komprim = new Uint8Array(await new Response(new Blob([surova]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
  const serazene = [...polozky].sort((a, b) => a.lho - b.lho), casti = [], centraly = []; let pozice = 0;
  serazene.forEach((p, i) => {
    const dalsi = i + 1 < serazene.length ? serazene[i + 1].lho : konecDat;
    const c = p.central.slice(), cdv = new DataView(c.buffer);
    if (p.jmeno === jmeno) {
      const jm = new TextEncoder().encode(jmeno), h = new Uint8Array(30 + jm.length), hdv = new DataView(h.buffer);
      hdv.setUint32(0, 0x04034b50, true); hdv.setUint16(4, 20, true); hdv.setUint16(6, cdv.getUint16(8, true) & 0x0800, true);
      hdv.setUint16(8, 8, true); hdv.setUint16(10, cdv.getUint16(12, true), true); hdv.setUint16(12, cdv.getUint16(14, true), true);
      hdv.setUint32(14, crc, true); hdv.setUint32(18, komprim.length, true); hdv.setUint32(22, surova.length, true);
      hdv.setUint16(26, jm.length, true); h.set(jm, 30);
      cdv.setUint16(8, cdv.getUint16(8, true) & 0x0800, true); cdv.setUint16(10, 8, true); cdv.setUint32(16, crc, true);
      cdv.setUint32(20, komprim.length, true); cdv.setUint32(24, surova.length, true);
      cdv.setUint32(42, pozice, true); casti.push(h, komprim); pozice += h.length + komprim.length;
    } else {
      const usek = u8.subarray(p.lho, dalsi); cdv.setUint32(42, pozice, true); casti.push(usek); pozice += usek.length;
    }
    centraly.push(c);
  });
  const zacCentral = pozice, velCentral = centraly.reduce((s, c) => s + c.length, 0);
  const konec = new Uint8Array(22), kdv = new DataView(konec.buffer);
  kdv.setUint32(0, 0x06054b50, true); kdv.setUint16(8, centraly.length, true); kdv.setUint16(10, centraly.length, true);
  kdv.setUint32(12, velCentral, true); kdv.setUint32(16, zacCentral, true);
  return new Blob([...casti, ...centraly, konec]);
}

/* ============================================================ dokument */
function postavOdstavec(p) {
  const segmenty = []; let text = "";
  const projdi = el => { for (const c of el.children) {
    if (c.localName === "Fallback" && c.namespaceURI === MC) continue;
    if (c.namespaceURI === W && c.localName === "p") continue;            // vnořený odstavec (textové pole) zvlášť
    if (c.namespaceURI === W && c.localName === "t") { segmenty.push([c, text.length, text.length + c.textContent.length]); text += c.textContent; continue; }
    projdi(c); } };
  projdi(p);
  return { text, segmenty };
}
function jeVeFallbacku(el) { for (let a = el.parentElement; a; a = a.parentElement) if (a.localName === "Fallback" && a.namespaceURI === MC) return true; return false; }
async function nactiModel(file) {
  const buf = await file.arrayBuffer(), jm = file.name.toLowerCase();
  if (jm.endsWith(".docx")) {
    const xml = await zipCti(buf, "word/document.xml");
    const dom = new DOMParser().parseFromString(xml, "application/xml");
    if (dom.getElementsByTagName("parsererror").length) throw new Error("Dokument nejde přečíst.");
    const pEl = [...dom.getElementsByTagNameNS(W, "p")].filter(p => !jeVeFallbacku(p));
    const odst = pEl.map(postavOdstavec);
    return { druh: "docx", buf, dom, pEl, odst, texty: odst.map(o => o.text) };
  }
  if (jm.endsWith(".txt")) {
    const u8 = new Uint8Array(buf); let text, kod = "utf-8"; const bom = u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(u8); } catch (e) { text = new TextDecoder("windows-1250").decode(u8); kod = "windows-1250"; }
    text = text.replace(/^﻿/, "");
    const nl = text.includes("\r\n") ? "\r\n" : "\n";
    const texty = text.replace(/\r\n/g, "\n").split("\n");
    return { druh: "txt", buf, kod, bom, nl, texty };
  }
  throw new Error("Umím jen Word (.docx) a text (.txt).");
}
function nahradVModelu(m, i, a, b, stare, nove) {      // vrátí false, když tam to slovo už není

async function modelNaBlob(m) {

function najdiMisto(m, o) {
  const sedi = (i, a) => m.texty[i] && m.texty[i].slice(a, a + o.stare.length) === o.stare &&
    m.texty[i].slice(Math.max(0, a - o.pred.length), a) === o.pred && m.texty[i].slice(a + o.stare.length, a + o.stare.length + o.po.length) === o.po;
  if (sedi(o.i, o.a)) return [o.i, o.a];
  const kandidati = [];
  m.texty.forEach((t, i) => { let a = t.indexOf(o.stare); while (a >= 0) { if (sedi(i, a)) kandidati.push([i, a]); a = t.indexOf(o.stare, a + 1); } });
  if (kandidati.length) return kandidati.sort((x, y) => Math.abs(x[0] - o.i) - Math.abs(y[0] - o.i))[0];

const klik = (id, f) => $(id).addEventListener("click", () => f());
klik("b_vybrat", vyberDokument); klik("b_posledni", pokracuj);
klik("b_preskocit", preskoc); klik("b_opravit", oprav); klik("b_vratit", vrat);
klik("b_zapamatovat", zapamatujToto); klik("b_zapamatovat_vse", zapamatuj);
klik("b_ulozit", ulozOpravy); klik("b_dokumenty", zpetNaVyber);
klik("b_vsechny", opravVsechny);
let zavritCas = 0;
function zavri() {
  if (opravy.length && performance.now() - zavritCas > 5000) {
    zavritCas = performance.now();
    rekni(`Máte ${opravy.length} neuložených oprav. Uložte je tlačítkem Uložit opravy. Nebo klikněte znovu na Zavřít – opravy zůstanou zapamatované na příště.`);
    return;
  }
  ulozRozpracovane(); window.close();
  setTimeout(() => rekni("Okno zavřete křížkem vpravo nahoře."), 300);
}
klik("b_zavrit1", zavri); klik("b_zavrit2", zavri);
for (const el of document.querySelectorAll("[data-hlas]"))
  el.addEventListener("mouseenter", () => { if (!el.disabled && spusteno) rekni(el.id === "b_posledni" ? "Pokračovat s dokumentem " + el.innerText.split("\n").slice(1).join(" ").toLowerCase() : el.dataset.hlas); });
let napsano = null;
$("navrh").addEventListener("input", () => { clearTimeout(napsano); napsano = setTimeout(() => { const t = $("navrh").value.trim(); if (t) rekni(`Napsáno: ${t}. Hláskuji: ${hlaskuj(t)}.`); }, 900); });
$("navrh").addEventListener("keydown", e => { if (e.key === "Enter") oprav(); });
addEventListener("pagehide", () => ulozRozpracovane());   // neuložené opravy zůstanou zapamatované

let spusteno = false;
function start(tise = false) {
  if (spusteno) return; spusteno = true; $("uvod").remove();
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
  obnovVyber();
  if (!tise) rekni("Korektor. Přetáhněte sem dokument, nebo klikněte na Vybrat dokument.");
}
$("uvod").addEventListener("click", () => start());
document.addEventListener("keydown", e => {
  if (!spusteno && !(e.ctrlKey || e.altKey || e.metaKey || /^F\d+$/.test(e.key))) { e.preventDefault(); start(); }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
